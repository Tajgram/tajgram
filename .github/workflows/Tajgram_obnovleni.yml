name: 🔄 Tajgram Ultimate Smart Sync

on:
  workflow_dispatch: # Барои пахши дастӣ (запуск)
  schedule:
    - cron: '0 0 */3 * *' # Ҳар 3 рӯз автоматӣ навсозӣ мекунад

permissions:
  contents: write

jobs:
  smart_merge_upstream:
    runs-on: ubuntu-latest
    steps:
      # 1. Боркунии коди ҳозираи Tajgram бо тамоми таърих
      - name: Checkout Your Main Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Танзими бехатари профили Гит
      - name: Configure Git Developer Profile
        run: |
          git config --global user.name "Saidjun Chief Developer"
          git config --global user.email "saidjun@tajgram.messenger"

      # 3. Овардани ТАМОМИ навгониҳо ва обноваҳо аз Дуров
      - name: Fetch All Updates from DrKLO
        run: |
          git remote add upstream https://github.com/DrKLO/Telegram.git || true
          # --tags тамоми релизҳо ва версияҳои навро меорад
          git fetch upstream master --tags
          echo "🔍 САНҶИШ: Тамоми кодҳои нави Дуров аз интернет оварда шуданд."

      # 4. ОМЕХТА КАРДАНИ ҲУШМАНД (Smart Merge)
      - name: Merge Core Updates Safely (Line-by-Line)
        run: |
          echo "🛡️ Раванди омехтакунии кодҳо оғоз ёфт..."
          
          # Ин ҷо мӯъҷиза рӯй медиҳад: Гит кодҳоро сатр ба сатр мепайвандад.
          # -X ours танҳо барои ҳалли бархӯрдҳои мустақим истифода мешавад, 
          # то коди ту осеб набинад ва обноваҳои нав дар паҳлӯяш шинанд.
          git merge upstream/master -m "👑 Smart Update: Merged Durov's new lines with Tajgram custom lines" \
            --allow-unrelated-histories -X ours --no-edit || echo "✅ Омехтакунӣ бо муваффақият анҷом ёфт."

      # 5. САБТИ ДАҚИҚ ВА ДОИМӢ
      - name: Push Injected Updates
        run: |
          git push origin HEAD:master
          echo "🚀 СИНХРОНИЗАТСИЯИ КОМИЛ! Обноваҳои нав бо кодҳои ту якҷоя шуданд ва бехатар сабт гардиданд!"
