name: 🔄 Tajgram & Nekogram Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *' # Ҳар 3 рӯз як маротиба худкор навсозиҳоро мекашад

permissions:
  contents: write

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "Saidjon_Ai Chief Developer"
          git config --global user.email "saidjon@tajgram.messenger"

      - name: Merge Upstream Changes Safely
        run: |
          # Пайваст шудан ба манбаи расмии Nekogram
          git remote add upstream https://github.com/Nekogram/Nekogram.git || true
          git fetch upstream
          
          echo "🚀 Раванди ҳамоҳангсозӣ ва муттаҳидсозӣ оғоз шуд..."
          
          # Гузаштан ба шохаи асосӣ
          git checkout master || git checkout main
          
          # Муттаҳидсозии бехатар бо нигоҳ доштани тағйироти ту
          git merge upstream/master --no-edit || echo "⚠️ Баъзе ҷойҳо конфликт доранд, лутфан санҷед."
          
          echo "✅ Навгониҳо бомуваффақият бо ҳам омехта шуданд."

      - name: Push Updates to Origin
        run: |
          git push origin HEAD:master || git push origin HEAD:main
          echo "🚀 Tajgram бомуваффақият бо навгониҳои Nekogram муттаҳид шуд ва коди ту бехатар аст!"
