name: Merge Only Two Files

on:
  workflow_dispatch: # Бо пахши як тугма дар GitHub кор мекунад

jobs:
  merge-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "Tajgram Merge Bot"
          git config --global user.email "bot@tajgram.local"

      - name: File-level Merge for Two Files
        run: |
          # 1. Пайваст кардани репозиторияи аслии Telegram
          git remote add upstream https://github.com/DrKLO/Telegram.git
          git fetch upstream

          # 2. Гузариш ба шохаи develop
          git checkout develop

          # 3. МЕРГИ ТАНҲО ДУ ФАЙЛ (Бо истифода аз --merge, ки замена намекунад!)
          git checkout --merge upstream/master -- TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java TMessagesProj/build.gradle

          # 4. Сабт ва фиристодани тағйирот ба GitHub
          git add TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java TMessagesProj/build.gradle
          git commit -m "Merge upstream updates for MessagesController.java and build.gradle only" || echo "No changes to commit"
          git push origin develop
