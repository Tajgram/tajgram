name: Merge Two Files from Telegram to Develop

on:
  workflow_dispatch:

jobs:
  merge-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "Tajgram Merge Bot"
          git config --global user.email "bot@tajgram.local"

      - name: Fetch Upstream and Merge Two Files
        run: |
          git remote add upstream https://github.com/DrKLO/Telegram.git
          git fetch upstream
          git checkout --merge upstream/master -- TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java TMessagesProj/build.gradle

      - name: Commit and Push
        run: |
          git add TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java TMessagesProj/build.gradle
          git commit -m "Auto-merge: Update MessagesController and build.gradle from Telegram upstream" || echo "No changes to commit"
          git push origin HEAD
