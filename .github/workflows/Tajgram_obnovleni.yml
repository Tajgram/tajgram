name: 🔄 Tajgram Pure Upstream Sync (DEV BRANCH)

on:
  workflow_dispatch: # Иҷрои дастӣ танҳо бо хоҳиши худи шумо, ҳеҷ чизи автоматӣ ва худсарона нест

permissions:
  contents: write

jobs:
  sync_upstream_dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Тамоми таърихи кодро тоза мегирад

      - name: Configure Git
        run: |
          git config --global user.name "Saidjun Chief Developer"
          git config --global user.email "saidjun@tajgram.messenger"

      - name: Fetch and Clean Bring Upstream
        run: |
          # Пайваст шудан ба коди Дуров
          git remote add upstream https://github.com/DrKLO/Telegram.git || true
          git fetch upstream master

          echo "🚀 Раванди овардани навгониҳо: Мутобиқсозии тоза бо DrKLO..."
          
          # Шаблони аслии худи шумо: Иҷрои REBASE-и тоза бо коди Дуров.
          # Ин кафолат медиҳад, ки тамоми навгониҳо (ҳатто як нуқта) сатр ба сатр мисли коди тоза меоянд.
          # Опсияи '--strategy-option=ours' муҳофизати мутлақро таъмин мекунад: 
          # Дар ҳолати конфликт дар build.gradle, коди охирини ҳозираи шумо дар ҷояш мемонад ва вайрон намешавад.
          git rebase upstream/master -X ours

          echo "✅ Тамоми навгониҳои Дуров то як нуқта қабул шуданд ва коди шумо муҳофизат шуд."

      - name: Push Clean Updates to Dev
        run: |
          # Танҳо коди тозашударо ба шохаи 'dev' мефиристад.
          # Таърихи кӯҳнаи 3-6 моҳ пеш умуман кофта намешавад ва дубликат намеояд.
          git push origin HEAD:dev --force
          echo "🚀 Шохаи dev ҳоло 100% бо DrKLO баробар аст ва коди охирини шумо боқӣ монд!"
