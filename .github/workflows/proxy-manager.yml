name: Ultimate Autonomous Proxy Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  auto-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }}

      - name: Self-Cleaning & Auto-Fetch
        run: |
          # 1. Санҷиш ва сохтани ProxyAgent.java (агар мавҷуд набошад)
          PROXY_FILE="TMessagesProj/src/main/java/org/telegram/messenger/ProxyAgent.java"
          if [ ! -f "$PROXY_FILE" ]; then
            echo "Файли ProxyAgent ёфт нашуд, сохта истодаам..."
            mkdir -p "$(dirname "$PROXY_FILE")"
            cat <<EOF > "$PROXY_FILE"
          package org.telegram.messenger;

          public class ProxyAgent {
              public static void smartLoad() {
                  // Танзимот ё хондани прокси аз proxies.json
              }
          }
          EOF
            echo "ProxyAgent.java сохта шуд."
          else
            echo "ProxyAgent.java аллакай мавҷуд аст, даст намезанам."
          fi

          # 2. Тозакунии шаффоф дар BuildVars.java
          echo "Ҷустуҷӯи файли BuildVars.java..."
          FILE=$(find . -name "BuildVars.java" | head -n 1)
          if [ -f "$FILE" ]; then
            echo "Файл ёфт шуд: $FILE"
            echo "Тоза кардани проксиҳои кӯҳна..."
            sed -i '/PROXY_ADDRESS/d; /PROXY_PORT/d; /PROXY_SECRET/d' "$FILE"
            echo "Проксиҳои кӯҳна тоза шуданд."
          else
            echo "Хатогӣ: BuildVars.java ёфт нашуд!"
            exit 1
          fi

          # 3. Боргирӣ ва навсозии 10 прокси дар proxies.json
          echo "Боргирии проксиҳои нав ва сабт дар proxies.json..."
          python3 -c "
          import requests, json, os

          url = 'https://api.proxyscrape.com/v2/?request=getproxies&protocol=mtproto&timeout=10000'
          try:
              res = requests.get(url, timeout=10)
              lines = [l.strip() for l in res.text.splitlines() if l.strip()]
              
              # Танҳо сатрҳои дурустро мегирад (IP:PORT)
              clean_proxies = []
              for l in lines:
                  parts = l.split(':')
                  if len(parts) >= 2:
                      clean_proxies.append(l)
                  if len(clean_proxies) >= 10:
                      break

              if clean_proxies:
                  data = {'list': clean_proxies}
                  
                  # А) Сабт дар решаи лоиҳа (Root)
                  with open('proxies.json', 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2)
                  
                  # Б) Агар папкаи assets мавҷуд бошад, ба он ҷо ҳам менавасад
                  assets_dir = 'TMessagesProj/src/main/assets'
                  if os.path.exists(assets_dir):
                      with open(os.path.join(assets_dir, 'proxies.json'), 'w', encoding='utf-8') as f:
                          json.dump(data, f, indent=2)
                  
                  print('Муваффақият: 10 прокси ба proxies.json сабт ва нав карда шуд.')
              else:
                  print('Огоҳӣ: Прокси ёфт нашуд.')
          except Exception as e:
              print('Хатогӣ дар раванди API:', e)
          "

          # 4. Насби Агент дар BuildVars.java (Муҳофизат аз дубликат)
          if ! grep -q "setupProxy" "$FILE"; then
            sed -i '/public static boolean DEBUG_VERSION/a \    public static void setupProxy() { ProxyAgent.smartLoad(); }' "$FILE"
            echo "Агенти хушманд (setupProxy) бомуваффақият илова шуд."
          else
            echo "Агенти хушманд аллакай дар файл мавҷуд аст."
          fi

      - name: Push Auto-Update
        run: |
          git config --global user.name "Auto-Proxy-Bot"
          git config --global user.email "bot@proxy.com"
          git add .
          git commit -m "Auto-Update: proxies.json refreshed" || echo "No changes"
          git push https://${{ secrets.MY_TOKEN }}@github.com/Tajgram/tajgram.git master
