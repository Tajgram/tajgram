name: Test Secrets Connection

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug and Test Secrets
        run: |
          echo "--- Саиди Кушониён: Сар кардани санҷиши секретҳо ---"
          
          # Декод кардан бо санҷиши хатогӣ
          if ! REAL_ID=$(echo "${{ secrets.API_ID_BASE64 }}" | base64 --decode); then
            echo "ХАТО: API_ID_BASE64 декод нашуд!"
            exit 1
          fi
          
          if ! REAL_HASH=$(echo "${{ secrets.API_HASH_BASE64 }}" | base64 --decode); then
            echo "ХАТО: API_HASH_BASE64 декод нашуд!"
            exit 1
          fi
          
          if ! REAL_SHA256=$(echo "${{ secrets.SHA256_BASE64 }}" | base64 --decode); then
            echo "ХАТО: SHA256_BASE64 декод нашуд!"
            exit 1
          fi

          # Нишон додани натиҷа барои санҷиш
          echo "Секретҳо бомуваффақият хонда шуданд!"
          echo "API_ID: $REAL_ID"
          echo "API_HASH: $REAL_HASH"
          echo "SHA256: $REAL_SHA256"
          
          # Санҷиши мавҷудияти файл
          BV_FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -f "$BV_FILE" ]; then
            echo "Файли $BV_FILE ёфт шуд. Омода барои тағйирдиҳӣ."
          else
            echo "ХАТО: Файли $BV_FILE дар репозитория нест!"
            exit 1
          fi
          # 3. Иҷрои тағйирот бо истифода аз секретҳои аллакай хондашуда
          echo "--- Иҷрои тағйирот дар BuildVars.java ---"
          
          sed -i "s/APP_ID = 999999/APP_ID = $REAL_ID/g" $BV_FILE
          sed -i "s/APP_HASH = \"SECRET_HASH_PLACEHOLDER\"/APP_HASH = \"$REAL_HASH\"/g" $BV_FILE
          sed -i "s/SHA256_KEY = \"SECRET_SHA256_PLACEHOLDER\"/SHA256_KEY = \"$REAL_SHA256\"/g" $BV_FILE

          echo "STATUS: [DONE] - Файл бомуваффақият навсозӣ шуд."
          
          # 4. Санҷиши натиҷа (нишон додани 3 сатри тағйирёфта)
          echo "--- Натиҷаи тағйирот дар файл: ---"
          grep -E "APP_ID|APP_HASH|SHA256_KEY" $BV_FILE
          # 3. Санҷиши дақиқи техникӣ бе фош кардани секретҳо
          echo "--- САНҶИШИ ДАРОЗИИ МАЪЛУМОТ ДАР БУЛДВАРС ---"
          
          # Гирифтани айнан ҳамон сатрҳо аз файл
          LINE_ID=$(grep "APP_ID =" $BV_FILE)
          LINE_HASH=$(grep "APP_HASH =" $BV_FILE)
          
          # Ҳисоб кардани шумораи символҳо (дарозии сатр)
          LEN_ID=${#LINE_ID}
          LEN_HASH=${#LINE_HASH}
          
          echo "Дарозии умумии сатри APP_ID дар файл: $LEN_ID символ"
          echo "Дарозии умумии сатри APP_HASH дар файл: $LEN_HASH символ"
          
          # Санҷиши мантиқӣ: агар файл иваз нашуда бошад, дарозии сатри холии кӯҳна аниқ аст
          # "public static int APP_ID = 999999;" дарозиаш 33 символ аст.
          if [ "$LEN_ID" -eq 33 ]; then
            echo "ОГОҲӢ: APP_ID иваз НАШУДААСТ, ҳамон 999999 мондааст!"
          else
            echo "ИСПАТ: APP_ID бомуваффақият иваз шуд (дарозии нав: $LEN_ID)"
          fi
          
          # 1. Декод ва маска кардани секретҳо
          REAL_ID=$(echo "${{ secrets.API_ID_BASE64 }}" | base64 --decode)
          REAL_HASH=$(echo "${{ secrets.API_HASH_BASE64 }}" | base64 --decode)
          REAL_SHA256=$(echo "${{ secrets.SHA256_BASE64 }}" | base64 --decode)
          
          echo "::add-mask::$REAL_ID"
          echo "::add-mask::$REAL_HASH"
          echo "::add-mask::$REAL_SHA256"

          BV_FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          
          # 2. Иваз кардани сатрҳо ба таври пурра (барои пешгирии омехташавӣ)
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = $REAL_ID;/g" $BV_FILE
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$REAL_HASH\";/g" $BV_FILE
          sed -i "s/public static String SHA256_KEY = .*/public static String SHA256_KEY = \"$REAL_SHA256\";/g" $BV_FILE

          # 3. Санҷиши дақиқи дарозӣ
          LINE_ID=$(grep "APP_ID =" $BV_FILE)
          LINE_HASH=$(grep "APP_HASH =" $BV_FILE)
          
          echo "Дарозии умумии сатри APP_ID-и нав: ${#LINE_ID} символ"
          echo "Дарозии умумии сатри APP_HASH-и нав: ${#LINE_HASH} символ"

                    # 3. Санҷиши қатъӣ танҳо барои 1 сатр бе омехташавӣ
          echo "--- САНҶИШИ ДАҚИҚИ БУЛДВАРС (ТАНҲО 1 САТР) ---"
          
          # Ҷустуҷӯи дақиқ бо калимаи 'int ' то сатри Huawei-ро партояд
          LINE_ID=$(grep -E "public static int APP_ID =" $BV_FILE)
          LINE_HASH=$(grep -E "public static String APP_HASH =" $BV_FILE)
          
          # Ҳисоб кардани дарозии аслии ҳамин як сатр
          LEN_ID=${#LINE_ID}
          LEN_HASH=${#LINE_HASH}
          
          echo "Дарозии сатри аслии APP_ID (танҳо 1 сатр): $LEN_ID символ"
          echo "Дарозии сатри аслии APP_HASH (танҳо 1 сатр): $LEN_HASH символ"
          
          # Намоиши худи сатрҳо барои тасдиқи визуалӣ
          echo "Натиҷаи сатри APP_ID: $LINE_ID"
          echo "Натиҷаи сатри APP_HASH: $LINE_HASH"
          
          REAL_ID=$(echo "${{ secrets.API_ID_BASE64 }}" | base64 --decode)
          REAL_HASH=$(echo "${{ secrets.API_HASH_BASE64 }}" | base64 --decode)
          REAL_SHA256=$(echo "${{ secrets.SHA256_BASE64 }}" | base64 --decode)  
          
          BV_FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          
          sed -i "s/APP_ID = 999999;/APP_ID = $REAL_ID/g" $BV_FILE
          sed -i "s/APP_HASH = \"SECRET_HASH_PLACEHOLDER\"/APP_HASH = \"$REAL_HASH\"/g" $BV_FILE
          sed -i "s/SHA256_KEY = \"SECRET_SHA256_PLACEHOLDER\"/SHA256_KEY = \"$REAL_SHA256\"/g" $BV_FILE

          REAL_ID=$(echo "${{ secrets.API_ID_BASE64 }}" | base64 --decode)
          REAL_HASH=$(echo "${{ secrets.API_HASH_BASE64 }}" | base64 --decode)
          REAL_SHA256=$(echo "${{ secrets.SHA256_BASE64 }}" | base64 --decode)
          
          BV_FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          
          sed -i "s/APP_ID = 999999/APP_ID = $REAL_ID/g" $BV_FILE
          sed -i "s/APP_HASH = \"SECRET_HASH_PLACEHOLDER\"/APP_HASH = \"$REAL_HASH\"/g" $BV_FILE
          sed -i "s/SHA256_KEY = \"SECRET_SHA256_PLACEHOLDER\"/SHA256_KEY = \"$REAL_SHA256\"/g" $BV_FILE

          # 1. Декод ва маска кардани секретҳо
          REAL_ID=$(echo "${{ secrets.API_ID_BASE64 }}" | base64 --decode)
          REAL_HASH=$(echo "${{ secrets.API_HASH_BASE64 }}" | base64 --decode)
          REAL_SHA256=$(echo "${{ secrets.SHA256_BASE64 }}" | base64 --decode)
          
          echo "::add-mask::$REAL_ID"
          echo "::add-mask::$REAL_HASH"
          echo "::add-mask::$REAL_SHA256"

          BV_FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          
          # 2. Ивазкунии қатъӣ ва дақиқ
          sed -i "s/public static int APP_ID = 999999;/public static int APP_ID = $REAL_ID;/g" $BV_FILE
          sed -i "s/public static String APP_HASH = \"SECRET_HASH_PLACEHOLDER\"/public static String APP_HASH = \"$REAL_HASH\"/g" $BV_FILE
          sed -i "s/public static String SHA256_KEY = \"SECRET_SHA256_PLACEHOLDER\"/public static String SHA256_KEY = \"$REAL_SHA256\"/g" $BV_FILE

          # 3. Санҷиши дақиқи 1 сатр барои оромии хотир
          echo "--- САНҶИШИ НИҲОИИ БУЛДВАРС ---"
          LINE_ID=$(grep -E "public static int APP_ID =" $BV_FILE)
          LINE_HASH=$(grep -E "public static String APP_HASH =" $BV_FILE)
          
          echo "Дарозии сатри аслии APP_ID: ${#LINE_ID} символ"
          echo "Дарозии сатри аслии APP_HASH: ${#LINE_HASH} символ"
          echo "Натиҷа: $LINE_ID"
          echo "Натиҷа: $LINE_HASH"



