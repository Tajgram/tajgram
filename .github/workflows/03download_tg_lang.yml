name: Tajgram Intelligent Language Auto-Translator
on:
  workflow_dispatch: # Запуск дар лубой бранч тавассути сайти GitHub

permissions:
  contents: write

jobs:
  translate_lang:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Tajgram Repository
      uses: actions/checkout@v4
      with:
        clean: false
        token: ${{ secrets.MY_TOKEN }} # Токен барои пуши бехатар ба ҳамаи бранчҳо

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Translation Dependencies
      run: |
        pip install deep-translator

    - name: Run Massive 15k Translation Engine with Grammar Matrix
      shell: python
      run: |
        import os
        import re
        from deep_translator import GoogleTranslator
        import time

        source_file = 'TMessagesProj/src/main/res/values/strings.xml'
        target_dir = 'TMessagesProj/src/main/res/values-tg'
        target_file = os.path.join(target_dir, 'strings.xml')

        if not os.path.exists(target_dir):
            os.makedirs(target_dir)

        translator = GoogleTranslator(source='en', target='tg')
        translation_cache = {}

        # 👑 Луғати Грамматикаи Боқуввати Саидҷон (Муқоисаи 100% аниқ ва соф)
        grammar_dictionary = {
            "your phone number": "Рақами телефони шумо",
            "phone number": "рақами телефон",
            "message sent": "Паём фиристода шуд",
            "verification code": "Коди тасдиқ",
            "enter code": "Кодро ворид кунед",
            "connection error": "Хатогии пайвастшавӣ",
            "settings": "Танзимот",
            "support": "Дастгирӣ",
            "wallet": "Ҳамён",
            "balance": "Тавозун",
            "cancel": "Бекор кардан",
            "ok": "OK",
            "done": "Тайёр",
            "save": "Сабт кардан",
            "delete": "Нест кардан",
            "edit": "Ислоҳ кардан",
            "search": "Ҷустуҷӯ",
            "contacts": "Контактҳо",
            "calls": "Зангҳо",
            "saved messages": "Паёмҳои сабтшуда",
            "invite friends": "Даъват кардани дӯстон",
            "telegram features": "Имкониятҳои Tajgram",
            "new group": "Гурӯҳи нав",
            "new channel": "Канали нав",
            "new secret chat": "Чати махфии нав",
            "log out": "Баромадан",
            "privacy and security": "Махфият ва амният",
            "data and storage": "Маълумот ва хотира",
            "chat settings": "Танзимоти чат",
            "folders": "Папкаҳо",
            "devices": "Дастгоҳҳо",
            "language": "Забон",
            "gifts": "Тӯҳфаҳо",
            "channels": "Каналҳо",
            "groups": "Гурӯҳҳо",
            "online": "онлайн",
            "offline": "офлайн",
            "typing": "навишта истодааст...",
            "connecting": "Пайвастшавӣ...",
            "updating": "Навсозӣ..."
        }

        print("=== 👑 STARTING 100% FACTORY MIRROR TRANSLATOR ENGINE ===")
        
        # Хондани файли англисӣ сатр ба сатр
        with open(source_file, 'r', encoding='utf-8') as f:
            lines = f.readlines()

        output_lines = []
        
        # Регекс барои ёфтани тегҳо дар дохили сатр
        string_re = re.compile(r'(.*<string[^>]*name="([^"]+)"[^>]*>)(.*?)(</string>.*)', re.DOTALL)

        for line in lines:
            # Агар сатр теги кушодашавӣ ё коментарияи аввали файл бошад, онро дастӣ иваз мекунем
            if '<?xml' in line:
                output_lines.append('<?xml version="1.0" encoding="utf-8"?>\n')
                continue
            if '<!-- 👑 TAJGRAM' in line or '<!--' in line and 'SAIDJUN' in line:
                output_lines.append('<!-- 👑 TAJGRAM VIP OFFICIAL TAJIK LANGUAGE SYSTEM - DEVELOPED BY CHIEF DEVELOPER SAIDJUN (2025-2030) -->\n')
                continue
                
            match = string_re.match(line)
            if match:
                full_open_tag = match.group(1)
                string_name = match.group(2)
                inner_text = match.group(3)
                close_tag = match.group(4)

                # Танзимоти системавии забон
                if string_name == "LanguageCode":
                    output_lines.append(f'{full_open_tag}tg{close_tag}')
                    continue
                if string_name == "LanguageName":
                    output_lines.append(f'{full_open_tag}Тоҷикӣ{close_tag}')
                    continue
                if string_name == "LanguageNameInEnglish":
                    output_lines.append(f'{full_open_tag}Tajik{close_tag}')
                    continue

                if inner_text and len(inner_text.strip()) > 0:
                    clean_lower_text = inner_text.lower().strip()
                    
                    if clean_lower_text in grammar_dictionary:
                        output_lines.append(f'{full_open_tag}{grammar_dictionary[clean_lower_text]}{close_tag}')
                        continue

                    # СИПАРӢ АБРӢ: Маҳкам кардани фоизҳо, кодҳои техникӣ, \n ва кавычкаҳо
                    placeholder_pattern = re.compile(r'(%[0-9]+\$[a-zA-Z]|%[a-zA-Z]|\n|\\n|\\t|\\\'|\\\"|&amp;|&#[0-9]+;)')
                    placeholders = placeholder_pattern.findall(inner_text)
                    
                    protected_text = inner_text
                    mapping = {}
                    for i, ph in enumerate(placeholders):
                        ph_key = f"_PH{i}_"
                        mapping[ph_key] = ph
                        protected_text = protected_text.replace(ph, ph_key, 1)

                    # БРЕНДИНГИ ПРЕМИУМ
                    if "tajgram premium vip" in protected_text.lower() or "telegram premium" in protected_text.lower():
                        translated = protected_text
                    elif protected_text in translation_cache:
                        translated = translation_cache[protected_text]
                    else:
                        try:
                            translated = translator.translate(protected_text)
                            if not translated:
                                translated = protected_text
                            translation_cache[protected_text] = translated
                            time.sleep(0.01)
                        except:
                            translated = protected_text

                    # Ворид кардани кодҳои заводӣ ба ҷои худ
                    for ph_key, ph_val in mapping.items():
                        translated = re.sub(r'_\s*PH\s*' + re.escape(ph_key[3:-1]) + r'\s*_', ph_key, translated)
                        translated = translated.replace(ph_key, ph_val)

                    # Брендинг
                    if not any(x in translated.lower() for x in ['telegram.org', 'tg://', 't.me', 'telegramshort', 'telegram_']):
                        translated = re.sub(r'\bTelegram\b', 'Tajgram', translated, flags=re.IGNORECASE)
                        translated = re.sub(r'\bТелеграм\b', 'Таҷграм', translated, flags=re.IGNORECASE)
                    
                    translated = translated.replace("\n ", "\n").replace(" \n", "\n")
                    translated = re.sub(r"(?<!\\)'", r"\'", translated)
                    
                    output_lines.append(f'{full_open_tag}{translated}{close_tag}')
                else:
                    output_lines.append(line)
            else:
                # Агар сатр холӣ бошад ё коментария бошад, онро айнан нусхабардорӣ мекунад
                output_lines.append(line)

        # Сабти бинарии соф сатр ба сатр
        with open(target_file, 'wb') as f:
            for line in output_lines:
                f.write(line.encode('utf-8'))
            
        print(f"=== 🎉 SUCCESS: ALL STRINGS MIRRORED AND TRANSLATED SECURELY ===")

    - name: Commit and Secure Push Tajgram Language
      run: |
        git config --global user.name "Saidjun Chief Developer"
        git config --global user.email "saidjun@tajgram.messenger"
        git add TMessagesProj/src/main/res/values-tg/strings.xml
        
        if git diff-index --quiet HEAD --; then
          echo "No changes in translation."
        else
          git commit -m "👑 TAJGRAM LANGUAGE: Created 100% full Tajik base from factory blueprint"
          git push origin HEAD
