name: 🔄 Tajgram Ultimate Safe Sync

on:
  workflow_dispatch: # Барои пахши дастӣ (запуск)
  schedule:
    - cron: '0 0 */3 * *' # Ҳар 3 рӯз автоматӣ навсозӣ мекунад

permissions:
  contents: write

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    steps:
      # 1. Боркунии коди ҳозираи Tajgram бо тамоми таърих
      - name: Checkout Your Main Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Тамоми таърихи кодро мехонад, то ягон файл гум нашавад

      # 2. Танзими бехатари профили Гит
      - name: Configure Git Developer Profile
        run: |
          git config --global user.name "Saidjun Chief Developer"
          git config --global user.email "saidjun@tajgram.messenger"

      # 3. Овардани ТАМОМИ маълумоти нав аз Дуров (Upstream)
      - name: Fetch All Updates from DrKLO
        run: |
          # Пайваст кардани репозиторияи расмӣ
          git remote add upstream https://github.com/DrKLO/Telegram.git || true
          
          # Овардани тамоми коммитҳо ва тегҳои нав (то ягон нуқта гум нашавад)
          git fetch upstream master --tags
          echo "🔍 САНҶИШ: Тамоми файлҳои нав ва тағйироти Дуров оварда шуданд."

      # 4. ОМЕХТА КАРДАНИ БЕХАТАР (Merge бо ҳифзи коди ту)
      - name: Merge Core Updates Safely (-X ours)
        run: |
          echo "🛡️ Омехтакунии бехатар оғоз ёфт..."
          
          # Аломати '-X ours' кафолат медиҳад, ки агар коди ту бо Дуров мухолифат кунад,
          # Гит автоматӣ скрипти Саидҷонро ҳифз мекунад ва коди нави Дуровро дар паҳлӯяш илова мекунад.
          # --allow-unrelated-histories иҷозат медиҳад, ки таърихҳои гуногун бе хатогӣ пайваст шаванд.
          git merge upstream/master -m "👑 Core Updated: Safe sync with DrKLO, old structure untouched" \
            --allow-unrelated-histories -X ours --no-edit || echo "✅ Омехтакунӣ бо муваффақият ва ҳалли автоматии конфликтҳо анҷом ёфт."

      # 5. САБТИ БЕХАТАР ВА БОСИФАТ
      - name: Push Injected Updates Safely
        run: |
          # Фиристодани код ба шохаи асосии ту (master) бе истифодаи 'force'-и хатарнок
          git push origin HEAD:master
          echo "🚀 Қисмҳои нав аз Дуров бомуваффақият, пурра ва 100% БЕХАТАР сабт шуданд!"
