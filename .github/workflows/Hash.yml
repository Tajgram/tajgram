name: Test Secrets Connection

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug and Test Secrets
        run: |
          echo "--- Саиди Кушониён: Сар кардани санҷиши секретҳо ---"
          
          # Декод кардан бо санҷиши хатогӣ
          if ! REAL_ID=$(echo "${{ secrets.API_ID_BASE64 }}" | base64 --decode); then
            echo "ХАТО: API_ID_BASE64 декод нашуд!"
            exit 1
          fi
          
          if ! REAL_HASH=$(echo "${{ secrets.API_HASH_BASE64 }}" | base64 --decode); then
            echo "ХАТО: API_HASH_BASE64 декод нашуд!"
            exit 1
          fi
          
          if ! REAL_SHA256=$(echo "${{ secrets.SHA256_BASE64 }}" | base64 --decode); then
            echo "ХАТО: SHA256_BASE64 декод нашуд!"
            exit 1
          fi

          # Нишон додани натиҷа барои санҷиш
          echo "Секретҳо бомуваффақият хонда шуданд!"
          echo "API_ID: $REAL_ID"
          echo "API_HASH: $REAL_HASH"
          echo "SHA256: $REAL_SHA256"
          
          # Санҷиши мавҷудияти файл
          BV_FILE="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if [ -f "$BV_FILE" ]; then
            echo "Файли $BV_FILE ёфт шуд. Омода барои тағйирдиҳӣ."
          else
            echo "ХАТО: Файли $BV_FILE дар репозитория нест!"
            exit 1
          fi
          # 3. Иҷрои тағйирот бо истифода аз секретҳои аллакай хондашуда
          echo "--- Иҷрои тағйирот дар BuildVars.java ---"
          
          sed -i "s/APP_ID = 999999/APP_ID = $REAL_ID/g" $BV_FILE
          sed -i "s/APP_HASH = \"SECRET_HASH_PLACEHOLDER\"/APP_HASH = \"$REAL_HASH\"/g" $BV_FILE
          sed -i "s/SHA256_KEY = \"SECRET_SHA256_PLACEHOLDER\"/SHA256_KEY = \"$REAL_SHA256\"/g" $BV_FILE

          echo "STATUS: [DONE] - Файл бомуваффақият навсозӣ шуд."
          
          # 4. Санҷиши натиҷа (нишон додани 3 сатри тағйирёфта)
          echo "--- Натиҷаи тағйирот дар файл: ---"
          grep -E "APP_ID|APP_HASH|SHA256_KEY" $BV_FILE
          # 3. Санҷиши дақиқи техникӣ бе фош кардани секретҳо
          echo "--- САНҶИШИ ДАРОЗИИ МАЪЛУМОТ ДАР БУЛДВАРС ---"
          
          # Гирифтани айнан ҳамон сатрҳо аз файл
          LINE_ID=$(grep "APP_ID =" $BV_FILE)
          LINE_HASH=$(grep "APP_HASH =" $BV_FILE)
          
          # Ҳисоб кардани шумораи символҳо (дарозии сатр)
          LEN_ID=${#LINE_ID}
          LEN_HASH=${#LINE_HASH}
          
          echo "Дарозии умумии сатри APP_ID дар файл: $LEN_ID символ"
          echo "Дарозии умумии сатри APP_HASH дар файл: $LEN_HASH символ"
          
          # Санҷиши мантиқӣ: агар файл иваз нашуда бошад, дарозии сатри холии кӯҳна аниқ аст
          # "public static int APP_ID = 999999;" дарозиаш 33 символ аст.
          if [ "$LEN_ID" -eq 33 ]; then
            echo "ОГОҲӢ: APP_ID иваз НАШУДААСТ, ҳамон 999999 мондааст!"
          else
            echo "ИСПАТ: APP_ID бомуваффақият иваз шуд (дарозии нав: $LEN_ID)"
          fi
