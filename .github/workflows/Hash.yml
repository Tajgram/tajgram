name: Saidjon_Ai Build Workflow
# Ин қисм барои он аст, ки ту дастӣ (manual) сар кунӣ
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'warning'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Saidjon_Ai Diagnostic
        run: |
          echo "--- Saidjon_Ai Security Check Started ---"
          # Санҷиши вуҷуд доштани Secret
          if [ -z "${{ secrets.APP_HASH_BASE64 }}" ]; then
            echo "STATUS: [BLOCKED] - APP_HASH дар Secret пайдо нашуд!"
            exit 1
          fi

          # Декод кардан ва санҷиш
          echo "${{ secrets.APP_HASH_BASE64 }}" | base64 --decode > decoded_temp.txt
          
          # Нишон додани натиҷа (бидуни нишон додани худи калид)
          SIZE=$(wc -c < decoded_temp.txt)
          echo "STATUS: [ACTIVE]"
          echo "Decoded Hash Size: $SIZE bytes"
          
          # Тасдиқи ниҳоӣ
          if [ $SIZE -gt 0 ]; then
            echo "RESULT: Success - Hash декод шуд ва барои Build омода аст."
          else
            echo "RESULT: [FAILED] - Декод шуд, аммо холӣ аст."
            exit 1
          fi
          echo "--- Saidjon_Ai Security Check Finished ---"
